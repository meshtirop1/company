{% extends 'base_ko.html' %}
{% load static %}

{% block title %}문제가 발생했습니다{% endblock %}

{% block css %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'css/error_page.css' %}">
{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-card">
    <div class="error-code error-500">500</div>
    <h1>문제가 발생했습니다</h1>
    <p class="lead">서버에 일시적인 문제가 발생했습니다.</p>
    <p class="muted">잠시 후 다시 시도해 주세요. 문제가 계속되면 지원팀에 문의하세요.</p>
    <div class="error-actions">
      <a href="{% url 'home' %}" class="button-primary">홈으로</a>
    </div>
  </div>
</div>
{% endblock %}
