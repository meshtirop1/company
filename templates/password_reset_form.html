{% extends 'base_en.html' %}
{% load static %}

{% block title %}Reset Password{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{% static 'css/manage_holidays.css' %}">
{% endblock %}

{% block content %}
<h2>Reset Password</h2>
<p>Enter your account email address and we'll send you a link to reset your password.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="button-primary">Send reset link</button>
</form>
{% endblock %}
