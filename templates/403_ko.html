{% extends 'base_ko.html' %}
{% load static %}

{% block title %}접근 금지{% endblock %}

{% block css %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'css/error_page.css' %}">
{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-card">
    <div class="error-code error-403">403</div>
    <h1>접근 금지</h1>
    <p class="lead">이 페이지를 볼 권한이 없습니다.</p>
    <p class="muted">잘못된 접근이라고 생각되시면 관리자에게 문의하세요.</p>
    <div class="error-actions">
      <a href="{% url 'home' %}" class="button-primary">홈으로</a>
      <a href="{% url 'login' %}" class="button-secondary">로그인</a>
    </div>
  </div>
</div>
{% endblock %}
